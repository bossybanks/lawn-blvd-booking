<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Lawn Blvd Calendar</title></head><body><header><img src="/lawn-blvd-logo.webp"><b>Private Calendar</b><a href="/">Booking page</a></header><main style="width:min(1100px,calc(100% - 28px));margin:24px auto"><section><h1 style="color:#1a5b34">Upcoming bookings</h1><p>Enter your admin password. Your username can be anything.</p><div class="inputs" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Username<input id="user" value="owner"></label><label>Admin password<input id="password" type="password"></label></div><button id="load" style="margin-top:12px;padding:12px 18px;border:0;border-radius:8px;background:#ec5597;color:white;font-weight:bold">Open calendar</button><p id="msg"></p></section><section id="bookings" style="margin-top:14px"></section></main><script>let auth='';const $=x=>document.querySelector(x);$('#load').onclick=async()=>{auth='Basic '+btoa($('#user').value+':'+$('#password').value);const r=await fetch('/api/admin/bookings',{headers:{Authorization:'Bearer '+$('#password').value}});if(!r.ok){$('#msg').textContent='Incorrect password.';return}const rows=await r.json();$('#msg').textContent='';$('#bookings').innerHTML='<h2>Bookings</h2>'+(rows.length?rows.map(x=>`<article style="padding:14px 0;border-bottom:1px solid #dce8df"><b>${x.appointment_date.slice(0,10)} · ${x.appointment_time}</b><p>${x.name} · ${x.phone}<br>${x.address}, ${x.city} ${x.zip}<br><strong>$${(x.amount_cents/100).toFixed(2)} · ${x.status}</strong></p></article>`).join(''):'<p>No upcoming bookings.</p>')};</script></body></html>
